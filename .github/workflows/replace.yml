name: Replace with Firebase code

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip uploaded file
        run: |
          test -f cafe-reza-firebase.zip
          rm -rf extracted
          mkdir extracted
          unzip -o cafe-reza-firebase.zip -d extracted
          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1)" ]; then
            mv extracted/*/* extracted/ 2>/dev/null || true
          fi

      - name: Replace repository files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name extracted -exec rm -rf {} +
          cp -a extracted/. .
          rm -rf extracted
          git status --short | head -n 200

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace with Firebase code" || echo "No changes to commit"
          git push
